const textQ=DATA.text, symQ=DATA.symbols;
let mode="",qs=[],idx=0,score=0,timer=30,iv=null,answered=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function home(){clearInterval(iv);show("menu")}
function show(id){["menu","learn","quiz","result"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function learn(){
 show("learn"); const cats=[...new Set([...textQ.map(x=>x.category),"Symbolabfrage"])];
 const s=document.getElementById("cat"); s.innerHTML="";
 s.innerHTML+=`<option value="__ALL__">Alle Fragen (${textQ.length+symQ.length})</option>`;cats.forEach(c=>{let n=c==="Symbolabfrage"?symQ.length:textQ.filter(x=>x.category===c).length;s.innerHTML+=`<option value="${c}">${c} (${n})</option>`});
}
function exam(){
 mode="exam"; qs=shuffle([...textQ,...symQ]).slice(0,30); idx=0;score=0;show("quiz");render();
}
function startLearn(){
 mode="learn"; let c=document.getElementById("cat").value; let pool=c==="__ALL__"?[...textQ,...symQ]:(c==="Symbolabfrage"?symQ:textQ.filter(x=>x.category===c));
 let n=document.getElementById("count").value; qs=shuffle(pool).slice(0,n==="all"?pool.length:+n);idx=0;score=0;show("quiz");render();
}
function render(){
 answered=false;document.getElementById("feedback").innerHTML="";document.getElementById("next").classList.add("hidden");
 let x=qs[idx];document.getElementById("catLabel").textContent=x.category;
 document.getElementById("timer").textContent=mode==="exam"?timer+" s":"";
 let body=`<div class="question"><b>Frage ${idx+1} / ${qs.length}</b><br>${x.q}</div>`;
 if(x.image) body+=`<div class="symbol">${x.image}</div>`;
 document.getElementById("q").innerHTML=body;
 let opts=x.options?shuffle(x.options.map((t,i)=>({t,i}))):[];
 // For symbol questions, remember the original answer by text.
 document.getElementById("opts").innerHTML=opts.map(o=>`<button class="option" data-val="${htmlEscape(o.t)}" onclick="answer(this,${x.options.indexOf(o.t)})">${o.t}</button>`).join("");
 if(mode==="exam"){timer=30;clearInterval(iv);iv=setInterval(()=>{timer--;document.getElementById("timer").textContent=timer+" s";if(timer<=0){clearInterval(iv);answer(null,-1,true)}},1000)}
}
function htmlEscape(s){return s.replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function answer(el,choice,timeout=false){
 if(answered)return;answered=true;clearInterval(iv);
 let x=qs[idx], correct=x.correct;
 // text bank uses correct=0, symbol bank uses computed correct index
 let ok=choice===correct;
 document.querySelectorAll(".option").forEach(b=>{let txt=b.textContent;if(x.options[correct]===txt)b.classList.add("correct");if(el&&b===el&&!ok)b.classList.add("wrong");b.disabled=true});
 if(ok)score+=mode==="exam"?100+timer*2:1;
 document.getElementById("feedback").innerHTML=`<div class="explain"><b>${ok?"✅ Richtig":"❌ Falsch"}</b>${timeout?" – Zeit abgelaufen.":""}<br>Richtige Antwort: <b>${x.options[correct]}</b></div>`;
 document.getElementById("next").classList.remove("hidden");
}
function nextQ(){idx++;if(idx>=qs.length)finish();else render()}
function finish(){
 show("result");let pct=Math.round(score/(mode==="exam"?qs.length*160:qs.length)*100);
 if(mode==="exam"){document.getElementById("result").innerHTML=`<h1>Prüfung beendet</h1><p>${score} Punkte</p><p>Ergebnis: <b>${pct}%</b></p><p>${pct>=70?"✅ Bestanden":"❌ Nicht bestanden"}</p><button class="btn" onclick="home()">Zurück zum Menü</button>`}
 else {document.getElementById("result").innerHTML=`<h1>Lernen beendet</h1><p><b>${score}</b> von ${qs.length} richtig.</p><button class="btn" onclick="home()">Zurück zum Menü</button>`}
}
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body></html>
